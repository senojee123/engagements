<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Memory Challenge Leaderboard</title>
<meta name="description" content="See who has the highest score in the Memory Challenge pizza memory game!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0:       #12131f;
    --panel-a:    #1e2048;
    --panel-b:    #2e1a44;
    --gold:       #d9ab52;
    --accent:     #ff6b35;
    --silver:     #c9d0e0;
    --bronze:     #d0895a;
    --paper:      #f5efe0;
    --muted:      #a6a9c8;
    --score-color:#ffd166;
    --tile-a:       rgba(255,255,255,0.04);
    --tile-b:       rgba(255,255,255,0.04);
    --tile-border:  rgba(255,255,255,0.08);
    --panel-border: rgba(217,171,82,0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  html, body {
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% -10%, #2a1e5c 0%, var(--bg-0) 60%);
    color: var(--paper);
    font-family: 'Manrope', sans-serif;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
  }

  /* ══════════════════════════════════
     CONFETTI CANVAS
  ══════════════════════════════════ */
  #confetti-canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  /* ══════════════════════════════════
     PAGE WRAPPER
  ══════════════════════════════════ */
  .page {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: clamp(16px, 3vw, 32px) clamp(12px, 3vw, 36px) clamp(20px, 4vw, 40px);
    max-width: 1200px;
    margin: 0 auto;
  }

  /* ══════════════════════════════════
     HEADER
  ══════════════════════════════════ */
  .page-header {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    text-align: center;
    margin-bottom: clamp(16px, 3vw, 28px);
    gap: 12px;
  }

  .back-btn {
    position: absolute;
    left: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(217,171,82,0.4);
    color: var(--gold);
    font-size: 1.2rem;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    text-decoration: none;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: background 0.15s;
  }
  .back-btn:active { background: rgba(217,171,82,0.22); }

  .header-center { display: flex; flex-direction: column; align-items: center; gap: 2px; }

  .crown {
    font-size: clamp(1.4rem, 3.5vw, 2rem);
    animation: crownbounce 2s ease-in-out infinite;
    line-height: 1;
  }
  @keyframes crownbounce {
    0%,100% { transform: translateY(0) rotate(-4deg); }
    50%      { transform: translateY(-5px) rotate(4deg); }
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: clamp(1.1rem, 3.5vw, 2rem);
    letter-spacing: 0.04em;
    background: linear-gradient(135deg, #ffe08a 0%, var(--accent) 55%, #c77dff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-transform: uppercase;
    animation: shimmer 4s ease-in-out infinite;
    line-height: 1.15;
  }
  @keyframes shimmer {
    0%,100% { filter: brightness(1); }
    50%      { filter: brightness(1.3); }
  }

  /* scoring rule pills under the title */
  .scoring-info {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: clamp(14px, 2.5vw, 24px);
  }
  .score-pill {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,209,102,0.35);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: clamp(0.64rem, 1.8vw, 0.78rem);
    color: var(--score-color);
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }

  /* ══════════════════════════════════
     LEADERBOARD BODY
  ══════════════════════════════════ */
  .columns {
    display: flex;
    justify-content: center;
    flex: 1;
    align-items: start;
  }

  /* ──────────────────────────────────
     LEADERBOARD PANEL
  ────────────────────────────────── */
  .lb-panel {
    width: 100%;
    max-width: 560px;
    background: linear-gradient(160deg, var(--panel-a), var(--panel-b));
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    padding: clamp(14px, 2.5vw, 22px);
    backdrop-filter: blur(10px);
    box-shadow: 0 0 50px rgba(199,125,255,0.12), 0 0 0 1px rgba(255,255,255,0.04);
  }

  .lb-panel-title {
    font-family: 'Fraunces', serif;
    font-size: clamp(0.85rem, 2vw, 1.05rem);
    font-weight: 700;
    color: var(--gold);
    text-align: center;
    margin-bottom: clamp(10px, 2vw, 16px);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  /* live pulse dot */
  .live-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4cde80;
    box-shadow: 0 0 6px #4cde80;
    animation: livepulse 1.4s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes livepulse {
    0%,100% { transform: scale(1);   opacity: 1; }
    50%      { transform: scale(1.5); opacity: 0.5; }
  }

  .live-label {
    font-family: 'Manrope', sans-serif;
    font-size: 0.62rem;
    font-weight: 800;
    letter-spacing: 0.1em;
    color: #4cde80;
    text-transform: uppercase;
  }

  .lb-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: clamp(6px, 1.2vw, 9px);
    max-height: 68vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-right: 2px;
  }

  /* scrollbar styling */
  .lb-list::-webkit-scrollbar { width: 4px; }
  .lb-list::-webkit-scrollbar-track { background: transparent; }
  .lb-list::-webkit-scrollbar-thumb { background: rgba(217,171,82,0.3); border-radius: 2px; }

  .lb-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--tile-a);
    border: 1px solid var(--tile-border);
    border-radius: 12px;
    padding: clamp(8px, 1.5vw, 12px) clamp(10px, 1.8vw, 14px);
    transition: transform 0.15s;
  }
  .lb-row:hover { transform: translateX(3px); }

  /* Ranks below the podium alternate between the two brand tile colors */
  .lb-row:nth-child(odd)  { background: var(--tile-a); }
  .lb-row:nth-child(even) { background: var(--tile-b); }

  .lb-row.top1 {
    background: linear-gradient(135deg, rgba(217,171,82,0.22), rgba(255,209,102,0.06));
    border-color: var(--gold);
    box-shadow: 0 0 18px rgba(217,171,82,0.32);
  }
  .lb-row.top2 {
    background: linear-gradient(135deg, rgba(201,208,224,0.16), rgba(201,208,224,0.04));
    border-color: var(--silver);
    box-shadow: 0 0 12px rgba(201,208,224,0.25);
  }
  .lb-row.top3 {
    background: linear-gradient(135deg, rgba(208,137,90,0.18), rgba(208,137,90,0.04));
    border-color: var(--bronze);
    box-shadow: 0 0 12px rgba(208,137,90,0.24);
  }
  .lb-row.empty {
    justify-content: center;
    color: var(--muted);
    font-size: 0.85rem;
    border-style: dashed;
    padding: 22px 14px;
  }

  .lb-rank {
    width: 28px;
    text-align: center;
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: clamp(0.85rem, 1.8vw, 1.05rem);
    color: var(--muted);
    flex-shrink: 0;
  }
  .top1 .lb-rank, .top2 .lb-rank, .top3 .lb-rank { font-size: clamp(1rem, 2.2vw, 1.35rem); }

  .lb-info { flex: 1; min-width: 0; }
  .lb-name {
    font-weight: 700;
    font-size: clamp(0.8rem, 1.9vw, 0.97rem);
    color: var(--paper);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .lb-meta {
    font-size: clamp(0.62rem, 1.5vw, 0.72rem);
    color: var(--muted);
    margin-top: 1px;
  }

  .lb-score {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: clamp(0.92rem, 2vw, 1.15rem);
    color: var(--score-color);
    white-space: nowrap;
    text-shadow: 0 0 10px rgba(255,209,102,0.35);
  }
  .top1 .lb-score {
    background: linear-gradient(135deg, #ffe08a, #ff9d4d);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  /* ── Sparkles ── */
  .sparkle {
    position: fixed;
    pointer-events: none;
    font-size: 1rem;
    opacity: 0;
    z-index: 1;
    animation: sparkleAnim linear infinite;
  }
  @keyframes sparkleAnim {
    0%   { opacity: 0; transform: translateY(0) scale(0.5) rotate(0deg); }
    20%  { opacity: 1; }
    80%  { opacity: 0.55; }
    100% { opacity: 0; transform: translateY(-70px) scale(1.2) rotate(360deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .crown, h1, .sparkle { animation: none !important; }
    #confetti-canvas { display: none; }
  }
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<div class="page">

  <!-- ══ HEADER ══ -->
  <div class="page-header">
    <a class="back-btn" href="index.html" title="Back to game">←</a>
    <div class="header-center">
      <img id="brand-logo" src="" alt="Brand Logo" style="height:28px;object-fit:contain;display:none;margin-bottom:2px;" />
      <span class="crown">👑</span>
      <h1 id="lb-title">Memory Challenge Leaderboard</h1>
    </div>
  </div>



  <!-- ══ LEADERBOARD ══ -->
  <div class="columns">

    <div class="lb-panel">
      <div class="lb-panel-title">
        🏅 Top Players
        <span class="live-dot"></span>
        <span class="live-label">Live</span>
      </div>
      <ol class="lb-list" id="lbList"></ol>
    </div>

  </div><!-- /columns -->

</div><!-- /page -->

<script>
(function () {
  // ─────────────────────────────────────────────────────────────
  // Fetch the same brand config the game uses, and apply it here
  // ─────────────────────────────────────────────────────────────
  const FANFORGE_API =
    (typeof window !== 'undefined' && (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname === ''))
      ? 'http://localhost:8000'
      : 'https://api.innovativeengagements.online';

  const titleEl = document.getElementById('lb-title');
  const logoEl  = document.getElementById('brand-logo');

  const gradientMap = {
    'from-slate-950 via-indigo-950 to-slate-950': 'radial-gradient(ellipse at 50% -10%, #2a1e5c 0%, #12131f 60%)',
    'from-purple-950 via-slate-950 to-indigo-950': 'radial-gradient(ellipse at 50% -10%, #3b0764 0%, #0f172a 60%)',
    'from-emerald-950 via-slate-950 to-teal-950': 'radial-gradient(ellipse at 50% -10%, #064e3b 0%, #0f172a 60%)',
    'from-red-950 via-slate-950 to-amber-950': 'radial-gradient(ellipse at 50% -10%, #450a0a 0%, #0f172a 60%)',
    'from-slate-900 via-slate-950 to-slate-900': 'radial-gradient(ellipse at 50% -10%, #1e293b 0%, #020617 60%)',
  };

  function applyConfig(rawConfig) {
    if (!rawConfig) return;
    const config = rawConfig.config || rawConfig;

    if (config.brandColor) {
      document.documentElement.style.setProperty('--gold', config.brandColor);
      document.documentElement.style.setProperty('--score-color', config.brandColor);
    }
    if (config.accentColor) {
      document.documentElement.style.setProperty('--accent', config.accentColor);
    }

    // Leaderboard row tiles reuse the same tile back colors set for the game cards
    if (config.cardBackColor) {
      document.documentElement.style.setProperty('--tile-a', config.cardBackColor + '33');
      document.documentElement.style.setProperty('--tile-border', config.cardBackColor + '66');
    }
    const secondTile = (config.useDualColors && config.cardBackColor2) ? config.cardBackColor2 : config.cardBackColor;
    if (secondTile) {
      document.documentElement.style.setProperty('--tile-b', secondTile + '33');
    }

    // "Top Players" and "Scan to Play" panels — same brand colors, much more opaque (solid glass look)
    if (config.cardBackColor) {
      document.documentElement.style.setProperty('--panel-a', config.cardBackColor + 'ea');
    }
    if (secondTile) {
      document.documentElement.style.setProperty('--panel-b', secondTile + 'ea');
    }
    if (config.brandColor) {
      document.documentElement.style.setProperty('--panel-border', config.brandColor + '66');
    }

    // Leaderboard text (player names, QR hint emphasis) — opt-in override
    if (config.leaderboardTextColor) {
      document.documentElement.style.setProperty('--paper', config.leaderboardTextColor);
    }

    if (config.backgroundImage) {
      document.body.style.background = `url("${config.backgroundImage}") center/cover no-repeat`;
    } else if (config.bgGradient) {
      document.body.style.background = gradientMap[config.bgGradient] || config.bgGradient;
    } else if (config.backgroundColor) {
      document.body.style.background = config.backgroundColor;
      document.documentElement.style.setProperty('--bg-0', config.backgroundColor);
    }

    if (titleEl) {
      let gameTitle = config.gameTitle || config.title || 'Memory Challenge';
      if (typeof gameTitle === 'string' && (gameTitle.toUpperCase().includes('LANE') || !gameTitle.toUpperCase().includes('MEMORY'))) {
        gameTitle = 'Memory Challenge';
      }
      titleEl.textContent = `${gameTitle} Leaderboard`;

      // Title normally uses a fixed gradient (via background-clip:text);
      // an explicit titleColor overrides it with a solid brand color.
      const solidTitleColor = config.titleColor || config.brandColor;
      if (solidTitleColor) {
        titleEl.style.background = 'none';
        titleEl.style.webkitTextFillColor = solidTitleColor;
        titleEl.style.color = solidTitleColor;
      }
    }

    if (logoEl) {
      if (config.brandLogo) {
        logoEl.src = config.brandLogo;
        logoEl.style.display = 'block';
      } else {
        logoEl.style.display = 'none';
      }
    }
  }

  // Read query parameters
  const urlParams = new URLSearchParams(window.location.search);
  const qInstanceId = urlParams.get('instanceId') || urlParams.get('id');
  const qBrandId = urlParams.get('brandId') || urlParams.get('userId') || urlParams.get('brand');

  const queryParts = [];
  if (qInstanceId) queryParts.push(`instanceId=${encodeURIComponent(qInstanceId)}`);
  if (qBrandId) queryParts.push(`brandId=${encodeURIComponent(qBrandId)}`);
  const queryPath = queryParts.length > 0 ? `?${queryParts.join('&')}` : '';

  const cacheKey = qInstanceId
    ? `fanforge_game_config_${qInstanceId}`
    : qBrandId
    ? `fanforge_game_config_${qBrandId}_memory-challenge`
    : `fanforge_game_config_memory-challenge`;

  // Attempt to load from cache immediately to eliminate loading latency
  let hasLoadedFromCache = false;
  try {
    const cached = localStorage.getItem(cacheKey);
    if (cached) {
      const parsedConfig = JSON.parse(cached);
      if (parsedConfig) {
        applyConfig(parsedConfig);
        hasLoadedFromCache = true;
      }
    }
  } catch (e) {}

  const primaryApi = FANFORGE_API;
  const fallbackApi = 'http://localhost:8000';

  function fetchConfigFrom(apiUrl) {
    const ts = `_t=${Date.now()}`;
    const fullPath = queryPath ? `${queryPath}&${ts}` : `?${ts}`;
    return fetch(`${apiUrl}/api/game-config/memory-challenge${fullPath}`, { cache: 'no-store' })
      .then((r) => (r.ok ? r.json() : Promise.reject(new Error('Config not found'))))
      .then((config) => {
        if (config) {
          applyConfig(config);
          try {
            localStorage.setItem(cacheKey, JSON.stringify(config));
          } catch (e) {}
        }
      });
  }

  fetchConfigFrom(primaryApi).catch(() => {
    fetchConfigFrom(fallbackApi).catch(() => {});
  });

  // Preserve query parameters back to game
  const backBtn = document.querySelector('.back-btn');
  if (backBtn && window.location.search) {
    backBtn.href = 'index.html' + window.location.search;
  }
})();
</script>

<script type="module">
/* ════════════════════════════════════════════════
   FIREBASE — real-time leaderboard
════════════════════════════════════════════════ */
import { initializeApp }                          from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getDatabase, ref, onValue, query,
         orderByChild, limitToLast }               from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

const firebaseConfig = {
  apiKey:            "AIzaSyDTHb7X6tE3yLFIr7BiKKNfiM8KQNGKHHg",
  authDomain:        "memory-challenge-9cfa8.firebaseapp.com",
  databaseURL:       "https://memory-challenge-9cfa8-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "memory-challenge-9cfa8",
  storageBucket:     "memory-challenge-9cfa8.firebasestorage.app",
  messagingSenderId: "761387825435",
  appId:             "1:761387825435:web:3dc674f9885a99165dfbbe"
};

const app      = initializeApp(firebaseConfig);
const db       = getDatabase(app);
const lbList   = document.getElementById('lbList');

const MEDALS    = { 0: '🥇', 1: '🥈', 2: '🥉' };
const TOP_CLASS = { 0: 'top1', 1: 'top2', 2: 'top3' };

function fmt(s) {
  return `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
}

function esc(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

/* Real-time listener — fires immediately on load,
   then again every time any score changes in Firebase */
const scoresQuery = query(
  ref(db, 'scores'),
  orderByChild('score'),
  limitToLast(50)           // pull top 50, we'll slice to 10 in JS
);

onValue(scoresQuery, (snapshot) => {
  lbList.innerHTML = '';
  const data = snapshot.val();

  if (!data) {
    const li = document.createElement('li');
    li.className    = 'lb-row empty';
    li.textContent  = 'No scores yet — be the first to play! 🍕';
    lbList.appendChild(li);
    return;
  }

  // Firebase returns ordered ascending; reverse + take top 10
  const scores = Object.values(data)
    .sort((a, b) => b.score - a.score || a.seconds - b.seconds)
    .slice(0, 10);

  scores.forEach((entry, i) => {
    const li      = document.createElement('li');
    li.className  = 'lb-row' + (TOP_CLASS[i] ? ' ' + TOP_CLASS[i] : '');
    const rank    = MEDALS[i] !== undefined ? MEDALS[i] : (i + 1);
    li.innerHTML  = `
      <span class="lb-rank">${rank}</span>
      <span class="lb-info">
        <div class="lb-name">${esc(entry.name)}</div>
        <div class="lb-meta">${entry.moves} moves · ${fmt(entry.seconds)}</div>
      </span>
      <span class="lb-score">${entry.score ?? 0} pts</span>
    `;
    lbList.appendChild(li);
  });
}, (error) => {
  /* show connection error in the list */
  lbList.innerHTML = '';
  const li = document.createElement('li');
  li.className   = 'lb-row empty';
  li.textContent = '⚠️ Could not connect to Firebase. Check your internet.';
  lbList.appendChild(li);
  console.error('Firebase read error:', error);
});

</script>
</body>
</html>
